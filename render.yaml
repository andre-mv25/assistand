services:
  - type: web
    name: assistand
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI_ATLAS
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: BANXICO_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false